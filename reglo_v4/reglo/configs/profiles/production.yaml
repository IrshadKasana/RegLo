# ════════════════════════════════════════════════════════════════════════════
#  PRODUCTION — the real study, at full scale, on GPUs        (mirror: smoke.yaml)
#
#      python scripts/run_study.py --gpus 0,1,2,3          one cloud machine, every GPU
#      bash cluster/slurm/submit_pipeline.sh                PARAM (SLURM)
#      bash cluster/pbs/submit_pipeline.sh                  Agastya (PBS Pro)
#
#  Every number that differs between a smoke test and the real study is set here
#  and in smoke.yaml — nowhere else (the group files hold ??? for them). Results:
#  artifacts/production/. Precedence: group files < this profile < the experiment
#  file's overrides < the command line.
# ════════════════════════════════════════════════════════════════════════════
description: The real study — thesis numbers, GPUs only
allow_synthetic_data: false

runs:                                  # every run of Stages 1–3
  device: cuda                         # a node without a GPU stops at once instead of training for days on CPUs
  dataset:
    train_subset: null                 # every training image (SVHN: the optimizee half, 36,629)
    test_subset: null                  # the whole official test set
  training:                            # Stages 2–3 (per-dataset budgets in by_dataset below)
    epochs: 50                         # SVHN, FMNIST; CIFAR-10/100: 100
    train_eval_every: 5                # clean pass over the training set every 5 epochs and at the end
    convergence_patience: 100          # "training loss does not decrease for 100 consecutive steps" (paper's PoC)
    checkpoint_every: 5                # epochs
  meta_training:                       # Stage 1 (Algorithm 1)
    schedule:
      num_trajectories: 10000          # optimizees trained from scratch — the meta-training epochs of the
                                       # DM / L2O-DM codebases (Andrychowicz et al. 2016; Chen et al. 2020)
      trajectory_steps: 1000           # inner steps per optimizee when the curriculum is off
      curriculum:                      # Chen et al. (2020): lengthen the horizon when validation stalls
        trajectory_steps: [100, 200, 500, 1000]   # multiples of the 20-step unroll
        patience: 3                    # validations without improvement before the next length
    validation:
      every: 20                        # trajectories between validations (φ selection, curriculum)
      optimizees: 5                    # fresh optimizees trained with the frozen φ, scores averaged
      steps: 1000                      # inner steps each — the longest training horizon
    checkpoint_every: 10               # trajectories between resumable checkpoints

by_dataset:                            # merged into the runs on that dataset
  cifar10:
    training: {epochs: 100}
  cifar100:
    training: {epochs: 100}

by_optimizee: {}                       # the architectures exactly as configs/optimizees/ defines them

grids:                                 # applied to the experiment files
  max_seeds: null                      # every seed listed (Stages 2–3: 42, 43, 44)
  diagnostics:                         # Stage-4 audits (configs/experiments/stage4_analysis.yaml)
    per_method: null                   # every finished run is audited
    hessian:
      power_iterations: 30
      hutchinson_samples: 50
      num_batches: 8
    sharpness:
      pga_steps: 10
      num_batches: 4
  compute:                             # same-GPU timing of the 12 variants
    warmup_steps: 20
    timed_steps: 100
