# ════════════════════════════════════════════════════════════════════════════
#  M2 — Optimizee + AdamW + regularizer r                     (protocol C2, explicit)
#
#  Trained with r computed at every step, wherever it runs:
#      min_θ  L(θ) + λ·R(θ)        (SAM, GAM and GSAM: two forward–backward passes per step; L1, L2: one)
#  Stage 1: on each round's source pair — the explicit-regularization benchmark against M1.
#  Stages 2–3: on every evaluation pair, as the explicit-regularization baseline beside M4(r); on
#  a round's source pair the Stage-1 runs serve (the evaluation files' from_stage1).
#
#      python scripts/train_optimizee.py method=m2_adamw_reg regularizer=sam optimizee=convnet4 dataset=svhn
# ════════════════════════════════════════════════════════════════════════════
defaults:
  optimizer: adamw
  regularizer: ???                   # pick one: regularizer=l1 | l2 | sam | gam | gsam

label: M2
name: m2_adamw_reg
optimizer_kind: conventional
regularizer_applied: every_step       # wherever an M2 run is trained (Stages 1–3)
allowed_regularizers: [l1, l2, sam, gam, gsam]
