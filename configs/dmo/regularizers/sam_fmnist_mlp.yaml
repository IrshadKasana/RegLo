train_arguments:
  # ============================================================
  # Design-v2 cell: SAM-LO meta-trained on FMNIST with an MLP
  # optimizee (penalty mode, Eq. 7). Auto-discovered by
  # experiment_config — no code registration needed.
  # ============================================================
  dataset: 'fmnist'
  optimizee_model_name: 'mlp'
  adaptive: True
  SAMonOptimizer: True
  base_optimizer: 'sgd'
  lr: 0.001   # EQUALIZED meta-lr (was 0.01). gam/gsam meta-train at 0.001; a 10x lr mismatch between arms confounds every LO-vs-LO comparison. Checkpoints trained at 0.01 must be RE-TRAINED for a matched-budget comparison.
  rho: 0.05
  model_name: 'SAMLO_fmnist_mlp_dev'
  regularizer: 'sam'
  optzee_wd: 0.0
  weight_decay: 0.0
  momentum: 0.0
  if_avreg: True
  if_pretrained: False
  pretrained_model_name: 'no_name'
  reg_mode: 'penalty'
  lambda_reg: 0.1
  xi: 1.0e-12
  if_smooth: True
